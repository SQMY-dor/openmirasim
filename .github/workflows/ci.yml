name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld pkg-config libssl-dev libsqlite3-dev bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor, which
          # bubblewrap needs. Lift it on the throwaway runner so sandbox tests run.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
        env:
          # Fail (instead of skip) the bwrap escape tests if the sandbox is unusable.
          OM_REQUIRE_BWRAP: "1"

      - name: Check ts-rs bindings are up to date
        run: |
          if [ -n "$(git status --porcelain -- apps/web/src/generated)" ]; then
            echo "::error::apps/web/src/generated is out of date. Run 'cargo test -p om-core' and commit the result."
            git status --porcelain -- apps/web/src/generated
            git diff -- apps/web/src/generated
            exit 1
          fi

  web:
    name: Web (typecheck / test / build / e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Playwright E2E (Mock Workbench)
        run: pnpm test:e2e

  fullstack-e2e:
    name: Full-Stack E2E (om-server + Web + SQLite restart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld pkg-config libssl-dev libsqlite3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build om-server
        run: cargo build --bin om-server

      - name: Install & build Web frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run full-stack Playwright E2E
        run: pnpm test:e2e:fullstack
