[workspace]
members = [
    "crates/om-core",
    "crates/om-server",
    "crates/om-cli",
    "crates/om-gui-bridge",
]
exclude = [
    "apps/tauri/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
om-core = { path = "crates/om-core" }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
futures-core = "0.3"
futures = "0.3"
http = "1"
portable-pty = "0.9"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-json-impl"] }
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "process", "io-util"] }
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
bytes = "1"
