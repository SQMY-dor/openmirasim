[workspace]
members = [
    "crates/om-core",
    "crates/om-server",
    "crates/om-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
om-core = { path = "crates/om-core" }
async-trait = "0.1"
futures-core = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-json-impl"] }
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tracing = "0.1"
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"
